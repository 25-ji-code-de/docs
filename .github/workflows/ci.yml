name: CI

on:
  push:
    branches: [main, master]
  # 不限定 base 分支 —— 栈式 PR（base 指向另一个特性分支）也应该跑 CI
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci || npm install
      # 文档里的示例必须与同一份文档的参考章节一致 ——
      # 人们复制的是示例，不是表格
      - name: Test
        run: npm test
      - name: Build docs
        run: npm run docs:build
